<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- #385 — favicon.svg (previously a hand-drawn vector matching the
         placeholder K-mark) is dropped: the real logo we now have is a
         raster asset with no vector source, and wrapping raster data in an
         .svg file for the sake of the type="image/svg+xml" hint gains
         nothing over just serving the .ico directly.
         #385 (follow-up) — the icon glyph itself (navy cap + light-blue
         book) sits on a transparent PNG background, so on a dark browser
         tab it lost its edges against the tab's own dark chrome. First
         tried a white rounded-square card behind the glyph, but that read
         as a background box rather than the logo itself; replaced with a
         thin white outline that hugs the glyph's own silhouette instead
         (dilate the alpha mask by ~1-2px at each favicon size, so the
         stroke stays a few pixels wide regardless of theme) — no
         backdrop shape, just a contour, so it still reads as "the logo"
         while staying visible against dark tab chrome. Left
         logo192.png/logo512.png (PWA/home-screen icons, not the browser
         tab) and manifest.json untouched — this was scoped to the tab
         icon only. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- #385 — matches the new --ink token (logo's navy). -->
    <meta name="theme-color" content="#013362" />
    <meta
      name="description"
      content="Encyclopedia — short, project-based courses in AI, data, and leadership."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- #367 — was a plain @import at the top of global.css, which the
         browser can't discover until it's already fetched and started
         parsing that stylesheet (CSS @import is itself render-blocking
         and adds a hop to the critical path). Moving it here means the
         browser sees the font request the moment it parses the HTML
         <head>, in parallel with the JS/CSS instead of after it — plus
         preconnect gets the DNS/TLS handshake to fonts.gstatic.com (where
         the actual .woff2 files live) started early too. Same families/
         weights/display=swap as before, just discovered sooner. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- #367 — Fraunces was requested at weights 500/600/700, but a grep
         across every var(--font-display) usage in src/ shows only 600 and
         700 are ever actually applied — weight 500 was dead weight in the
         render-blocking font chain. Dropped it; Inter/IBM Plex Mono are
         untouched since all their requested weights are in real use.
         #385 — Fraunces (a serif) is swapped for Poppins (a geometric
         sans) here: the real logo's "Encyclopedia" wordmark turned out to
         be set in Poppins Bold (confirmed by rendering "Encyclopedia" in
         both and overlaying them — same single-story 'a', same circular
         'e'/'o'/'c'/'d'/'p', same straight-diagonal 'y', matching stroke
         weight), and the client asked for the rest of the page's
         typography to follow the logo's font rather than keep the
         unrelated placeholder-era serif. Same two weights (600/700) the
         Fraunces link already carried, since every var(--font-display)
         usage in src/ only ever asks for one of those two. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- #403 — "Encyclopedia Learning" -> just "Encyclopedia": client call
         to trim the wordmark now that "Encyclopedia" alone is already
         long everywhere this appears (tab title, PWA install prompt,
         certificate footer, About/Privacy body copy, footer) — settled on
         dropping the second word entirely rather than swapping in
         another one. -->
    <title>Encyclopedia</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
