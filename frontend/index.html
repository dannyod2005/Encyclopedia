<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- #385 — favicon.svg (previously a hand-drawn vector matching the
         placeholder K-mark) is dropped: the real logo we now have is a
         raster asset with no vector source, and wrapping raster data in an
         .svg file for the sake of the type="image/svg+xml" hint gains
         nothing over just serving the .ico directly.
         #385 (follow-up) — the icon glyph itself (navy cap + light-blue
         book) sits on a transparent PNG background, so on a dark browser
         tab it lost its edges against the tab's own dark chrome. First
         tried a white rounded-square card behind the glyph, but that read
         as a background box rather than the logo itself; replaced with a
         thin white outline that hugs the glyph's own silhouette instead
         (dilate the alpha mask by ~1-2px at each favicon size, so the
         stroke stays a few pixels wide regardless of theme) — no
         backdrop shape, just a contour, so it still reads as "the logo"
         while staying visible against dark tab chrome. Left
         logo192.png/logo512.png (PWA/home-screen icons, not the browser
         tab) and manifest.json untouched — this was scoped to the tab
         icon only. -->
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- #385 — matches the new --ink token (logo's navy). -->
    <meta name="theme-color" content="#013362" />
    <meta
      name="description"
      content="Encyclopedia — short, project-based courses in AI, data, and leadership."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!-- #367 — was a plain @import at the top of global.css, which the
         browser can't discover until it's already fetched and started
         parsing that stylesheet (CSS @import is itself render-blocking
         and adds a hop to the critical path). Moving it here means the
         browser sees the font request the moment it parses the HTML
         <head>, in parallel with the JS/CSS instead of after it — plus
         preconnect gets the DNS/TLS handshake to fonts.gstatic.com (where
         the actual .woff2 files live) started early too. Same families/
         weights/display=swap as before, just discovered sooner. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- #456 — this app is fully client-rendered (index.html ships with no
         content beyond the shell below), so every real request — Supabase
         Auth's session check, and the backend's own API calls — only gets
         discovered once the JS bundle has downloaded, parsed, and started
         running. Preconnecting here starts the DNS/TLS handshake to both
         origins during the initial HTML parse instead of waiting for that,
         shaving a round trip off the first real request to each. Vite
         replaces %VITE_*% with the matching env var at build time — same
         mechanism import.meta.env.VITE_API_URL/VITE_SUPABASE_URL use in
         src/, just the HTML-side equivalent. -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- #367 — Fraunces was requested at weights 500/600/700, but a grep
         across every var(--font-display) usage in src/ shows only 600 and
         700 are ever actually applied — weight 500 was dead weight in the
         render-blocking font chain. Dropped it; Inter/IBM Plex Mono are
         untouched since all their requested weights are in real use.
         #385 — Fraunces (a serif) is swapped for Poppins (a geometric
         sans) here: the real logo's "Encyclopedia" wordmark turned out to
         be set in Poppins Bold (confirmed by rendering "Encyclopedia" in
         both and overlaying them — same single-story 'a', same circular
         'e'/'o'/'c'/'d'/'p', same straight-diagonal 'y', matching stroke
         weight), and the client asked for the rest of the page's
         typography to follow the logo's font rather than keep the
         unrelated placeholder-era serif. Same two weights (600/700) the
         Fraunces link already carried, since every var(--font-display)
         usage in src/ only ever asks for one of those two. -->
    <!-- #461 — display=swap -> display=optional. The layout-shifts audit on
         Dashboard's build-based Lighthouse run showed ~91% of its CLS
         (0.092 of 0.101) on a single item: the whole .grid reflowing,
         subItems cause "Web font loaded" x2 (Inter + IBM Plex Mono) — plus
         two smaller "Web font loaded" shifts on the Saved/Learning paths
         cards and the H1 title. That's swap doing exactly what it's
         designed to do: paint the fallback font immediately, then swap to
         the real one whenever it arrives, reflowing every line whose
         metrics differ between the two. optional keeps the same instant
         fallback paint, but gives the font a short window (~100ms, spec's
         "font block period") to arrive from cache/network; if it doesn't
         make that window, the browser commits to the fallback for the
         rest of this page load instead of swapping in later — so there is
         no swap-triggered reflow to shift anything, on any page, not just
         Dashboard. Trade-off: on a cold cache the custom font may not
         appear until the next navigation (once it's cached, later loads
         get it within budget). Given "no layout shifts whatsoever" is the
         explicit goal of #461, that trade is the right one here. -->
    <!-- (perf follow-up) — a plain <link rel="stylesheet"> here blocks
         initial render until this CSS downloads (Lighthouse's
         render-blocking-requests audit measured ~270ms of the critical
         path on this one request). The actual font *files* it references
         were never render-blocking themselves (display=optional above
         already means the fallback paints instantly regardless), so
         there's no reason the tiny CSS file that just declares @font-face
         rules should hold up first paint either. Standard preload+swap
         trick: browser fetches this with as="style" priority (not
         render-blocking), then the onload flips its own media from
         "print" (matches nothing on this page, so it doesn't apply/block
         while loading) to "all" once it's actually in hand. <noscript>
         fallback covers the no-JS case, where onload never fires. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=optional"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=optional"
      />
    </noscript>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!-- #431 — moved here from public/index.html as part of the CRA ->
         Vite migration: Vite expects its HTML entry at the project root,
         not inside public/, and reads/transforms the <script> tag below
         to resolve the module graph starting from src/index.jsx. CRA's
         %PUBLIC_URL% templating (which the three asset paths above used
         to use) has no Vite equivalent and isn't needed — Vite serves the
         public/ folder's contents at the site root by default, so plain
         absolute paths (/favicon.ico, /logo192.png, /manifest.json) work
         the same way %PUBLIC_URL%/favicon.ico etc. did before. -->
    <!-- #403 — "Encyclopedia Learning" -> just "Encyclopedia": client call
         to trim the wordmark now that "Encyclopedia" alone is already
         long everywhere this appears (tab title, PWA install prompt,
         certificate footer, About/Privacy body copy, footer) — settled on
         dropping the second word entirely rather than swapping in
         another one. -->
    <title>Encyclopedia</title>
    <!-- #456 — static loading shell styles, inlined rather than left in
         global.css: global.css only reaches the page via the JS module
         graph (index.jsx imports it), so it isn't available until the
         bundle has loaded — exactly the gap this shell exists to cover.
         Inlining means the shell can paint from the raw HTML response
         alone, no extra request. Colors are hardcoded to global.css's
         --ink/--paper values rather than referencing the custom
         properties, since those properties are defined in that same
         not-yet-loaded stylesheet. Only opacity is animated (no layout
         properties), so this never registers as a Layout Instability API
         shift even while it's pulsing. -->
    <style>
      #enc-loading-shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f0e3;
      }
      /* (perf follow-up) — was 56x56 against /logo-icon.png (332x285,
         66KB, downscaled 6x in the browser just to end up back at this
         same 56px box). logo-icon-web.png already exists as a pre-cropped
         web variant (75x64, 5.6KB — already used at 19x16 in the footer)
         but isn't square (~1.17:1), so this box follows its native ratio
         (56x48) rather than force-squashing it into 56x56. */
      #enc-loading-shell img {
        width: 56px;
        height: 48px;
        animation: enc-loading-pulse 1.4s ease-in-out infinite;
      }
      @keyframes enc-loading-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- #456 — static shell: paints immediately from this HTML, before the
         JS bundle downloads/parses/runs. React's first render on initial
         mount (see src/index.jsx's createRoot(...).render(...)) replaces
         #root's entire contents wholesale, so this is automatically wiped
         the moment the real app is ready — no cleanup code needed here. -->
    <div id="root">
      <div id="enc-loading-shell" role="presentation">
        <!-- (perf follow-up) — was /logo-icon.png (332x285, 66KB): Lighthouse
             flagged this as the single biggest "improve image delivery"
             opportunity on the whole site (~65KB of avoidable download for
             an image rendered at 56px), since the browser has to fetch and
             decode the full 332px original just to shrink it into this
             tiny box, before the real app JS has even started. Swapped for
             the existing logo-icon-web.png crop (75x64, 5.6KB) — see the
             matching width/height change in the <style> block above for
             why the box itself moved from 56x56 to 56x48. -->
        <img src="/logo-icon-web.png" alt="" width="56" height="48" />
      </div>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
